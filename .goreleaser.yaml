version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: rungrid
    main: .
    binary: rungrid
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - >-
        -s -w
        -X github.com/jamesonstone/rungrid/cmd.Version={{.Version}}
        -X github.com/jamesonstone/rungrid/cmd.Commit={{.Commit}}
        -X github.com/jamesonstone/rungrid/cmd.BuildTime={{.Date}}
        -X github.com/jamesonstone/rungrid/cmd.Dirty=false

archives:
  - id: rungrid
    ids: [rungrid]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - CLI_SPEC.md

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    artifacts: checksum
    certificate: ${artifact}.pem
    args:
      - sign-blob
      - --yes
      - --output-signature=${signature}
      - --output-certificate=${certificate}
      - ${artifact}

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  prerelease: auto
