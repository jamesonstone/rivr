name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Format
        run: make fmt-check
      - name: Vet
        run: make vet
      - name: Unit and integration tests
        run: make test
      - name: Race tests
        run: make test-race
      - name: Contract sanitization
        run: make sanitize
      - name: Dependency licenses
        run: make license
      - name: Cross-platform builds
        run: make build-cross

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  vulnerability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Scan
        run: govulncheck ./...

  end-to-end:
    runs-on: ubuntu-latest
    env:
      PROCESS_COMPOSE_VERSION: v1.120.0
      PROCESS_COMPOSE_ARCHIVE_SHA256: 3792e1ed9f383832eb2362154444e8564fbc8e7e8e7cff8754c68aea5eca086e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install verified Process Compose
        run: |
          archive="$RUNNER_TEMP/process-compose_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/F1bonacc1/process-compose/releases/download/$PROCESS_COMPOSE_VERSION/process-compose_linux_amd64.tar.gz"
          printf '%s  %s\n' "$PROCESS_COMPOSE_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/rungrid-bin"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP/rungrid-bin" process-compose
          printf '%s\n' "$RUNNER_TEMP/rungrid-bin" >> "$GITHUB_PATH"
      - name: Headless lifecycle
        run: tests/end-to-end/local/run.sh
      - name: Upload immutable lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rungrid-headless-e2e-${{ github.run_id }}
          path: tmp/*/rungrid-headless-e2e/*
          if-no-files-found: error
          retention-days: 14

  release-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean --skip=sign
