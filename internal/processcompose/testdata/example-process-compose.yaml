version: "0.5"
name: example-workspace-k7m4q2
log_level: info
is_strict: true
ordered_shutdown: true
processes:
  database:
    command: ./wrappers/database
    working_dir: .
    log_location: ./logs/database.log
    is_dotenv_disabled: true
    availability:
      restart: no
      backoff_seconds: 1
      max_restarts: 0
    readiness_probe:
      exec:
        command: ./wrappers/database-health
        working_dir: .
      initial_delay_seconds: 0
      period_seconds: 2
      timeout_seconds: 3
      failure_threshold: 30
  api:
    command: ./wrappers/api
    working_dir: .
    log_location: ./logs/api.log
    is_dotenv_disabled: true
    disabled: true
    depends_on:
      database:
        condition: process_healthy
    availability:
      restart: no
      backoff_seconds: 1
      max_restarts: 0
  web:
    command: ./wrappers/web
    working_dir: .
    log_location: ./logs/web.log
    is_dotenv_disabled: true
    disabled: true
    availability:
      restart: no
      backoff_seconds: 1
      max_restarts: 0
